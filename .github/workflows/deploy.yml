name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # char.sqlite 不在版控（44MB）。從名為 data-v1 的 Release 取得；
      # 取不到時仍會建置（站台執行期會顯示「資料缺失」提示）。
      #
      # 思源黑體 BMP 子集也一起掛在那個 release 上。它是 scripts/setup-noto.py
      # 的產物（需 Python + fonttools + brotli），來源檔 16MB 也不在版控，
      # 所以 CI 不重跑它——只有 4.5MB，跟資料庫放同一個 release 最省事。
      - name: Fetch dataset from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/public/data web/public/fonts
          gh release download data-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern char.sqlite --dir web/public/data || \
            echo "找不到 data-v1 release 的 char.sqlite，將建置不含資料的站台。"
          gh release download data-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern NotoSansCJKtc-cjkbmp.woff2 --dir web/public/fonts || \
            echo "找不到 NotoSansCJKtc-cjkbmp.woff2，BMP 字型將回退到系統字型。"

      - name: Build
        working-directory: web
        env:
          # 自訂網域 hanglyph.eviat.me 的站根就是 /。
          # 若哪天改回 <user>.github.io/<repo>/ 形式，這裡要換回
          # /${{ github.event.repository.name }}/，否則資源路徑會少一層。
          VITE_BASE: /
          CHCT_SKIP_SETUP_DATA: "1" # 已自 release 放好資料，prebuild 不需從本機複製
        run: |
          npm ci
          # HanaMin 與 Plangothic 都是 gitignored，checkout 拿不到，必須在這裡下載。
          # setup-fonts.mjs 會略過已存在的檔案，所以不會蓋掉上一步抓下來的思源子集。
          npm run setup-fonts
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
