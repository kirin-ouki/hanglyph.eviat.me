name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      # 前端不需資料庫即可建置（執行期才以範圍請求載入 char.sqlite）
      - run: npm run build

  data:
    name: Data · scripts lint + validate (if db present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CI 無 Access 驅動，無法重跑遷移；僅做語法檢查，並在有 char.sqlite 時驗證。
      - run: python -m py_compile data/migrate.py data/validate.py
      - run: |
          if [ -f data/dist/char.sqlite ]; then
            python data/validate.py
          else
            echo "char.sqlite 不在版控中（預期行為），略過資料量驗證。"
          fi
